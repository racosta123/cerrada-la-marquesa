name = "la-marquesa-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGIN = "https://racosta123.github.io"
# Portero de fila de Shelly Cloud (límite ~1 req/s por cuenta). Ajustables sin tocar código:
SHELLY_MIN_SPACING_MS = 1200      # separación mínima entre llamadas reales a Shelly
SHELLY_RETRY_DELAY_MS = 1500      # pausa antes del único reintento por max_req / 429
SHELLY_CALL_TIMEOUT_MS = 8000     # tope de UNA llamada a Shelly (se aborta y responde 502); 0 = sin tope
SHELLY_MAX_QUEUE_WAIT_MS = 20000  # tope de espera en fila; pasado esto responde "reintenta" (503)
SHELLY_DEDUPE_WINDOW_MS = 2000    # mismo "abrir" a la misma puerta en esta ventana = una sola llamada

# Durable Object: UNA instancia global (nombre fijo "shelly-gate") que serializa Shelly Cloud.
[[durable_objects.bindings]]
name = "SHELLY_GATE"
class_name = "ShellyGate"

# new_sqlite_classes = backend SQLite (el recomendado hoy y el único disponible en plan Free).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShellyGate"]

[triggers]
crons = ["0 16 * * *"]

# Secrets (NO van aquí, se cargan con: wrangler secret put NOMBRE):
#   SHELLY_HOST  SHELLY_AUTH_KEY  FIREBASE_PROJECT
#   SA_EMAIL  SA_PRIVATE_KEY  QR_SECRET  READER_KEY  READER_SYNC_URL
